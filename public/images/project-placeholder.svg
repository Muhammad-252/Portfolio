<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d13" />
      <stop offset="50%" stop-color="#0f131a" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262f40" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#151b27" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="600" cy="400" r="350" fill="#3b82f6" opacity="0.08" filter="blur(80px)" />
  <circle cx="750" cy="350" r="280" fill="#8b5cf6" opacity="0.07" filter="blur(90px)" />

  <!-- Window Frame -->
  <g transform="translate(180, 140)">
    <!-- Window backdrop -->
    <rect width="840" height="520" rx="16" fill="url(#cardGlow)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    
    <!-- Top toolbar -->
    <rect width="840" height="48" rx="16" fill="#131822" />
    <path d="M 0 36 L 0 48 L 840 48 L 840 36 Z" fill="#131822" />
    <line x1="0" y1="48" x2="840" y2="48" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <!-- Window control dots -->
    <circle cx="28" cy="24" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="68" cy="24" r="6" fill="#10b981" opacity="0.8" />

    <!-- Address / Search pill -->
    <rect x="260" y="12" width="320" height="24" rx="12" fill="rgba(255, 255, 255, 0.06)" />
    <line x1="280" y1="24" x2="340" y2="24" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" stroke-linecap="round" />

    <!-- Sidebar mock -->
    <rect x="24" y="72" width="160" height="420" rx="10" fill="rgba(255, 255, 255, 0.03)" />
    <line x1="44" y1="102" x2="140" y2="102" stroke="rgba(255, 255, 255, 0.2)" stroke-width="3" stroke-linecap="round" />
    <line x1="44" y1="128" x2="110" y2="128" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="44" y1="150" x2="125" y2="150" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="44" y1="172" x2="95" y2="172" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Main Content Area -->
    <!-- Hero Banner Card inside window -->
    <rect x="208" y="72" width="608" height="180" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
    <rect x="236" y="100" width="180" height="8" rx="4" fill="url(#accent)" />
    <line x1="236" y1="126" x2="480" y2="126" stroke="rgba(255, 255, 255, 0.5)" stroke-width="4" stroke-linecap="round" />
    <line x1="236" y1="146" x2="420" y2="146" stroke="rgba(255, 255, 255, 0.2)" stroke-width="3" stroke-linecap="round" />
    <rect x="236" y="174" width="110" height="32" rx="8" fill="url(#accent)" opacity="0.9" />

    <!-- Content cards row -->
    <rect x="208" y="272" width="190" height="220" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" />
    <rect x="224" y="288" width="158" height="96" rx="6" fill="rgba(255, 255, 255, 0.06)" />
    <line x1="224" y1="404" x2="330" y2="404" stroke="rgba(255, 255, 255, 0.3)" stroke-width="3" stroke-linecap="round" />
    <line x1="224" y1="422" x2="300" y2="422" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2.5" stroke-linecap="round" />

    <rect x="417" y="272" width="190" height="220" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" />
    <rect x="433" y="288" width="158" height="96" rx="6" fill="rgba(255, 255, 255, 0.06)" />
    <line x1="433" y1="404" x2="540" y2="404" stroke="rgba(255, 255, 255, 0.3)" stroke-width="3" stroke-linecap="round" />
    <line x1="433" y1="422" x2="510" y2="422" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2.5" stroke-linecap="round" />

    <rect x="626" y="272" width="190" height="220" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" />
    <rect x="642" y="288" width="158" height="96" rx="6" fill="rgba(255, 255, 255, 0.06)" />
    <line x1="642" y1="404" x2="745" y2="404" stroke="rgba(255, 255, 255, 0.3)" stroke-width="3" stroke-linecap="round" />
    <line x1="642" y1="422" x2="710" y2="422" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
